name: CI

on:
  push:
    branches:
      - "claude/**"
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, Lint, Test
    runs-on: ubuntu-latest
    env:
      # Sandbox ortamlarında Prisma query engine indirilemeyebilir
      # (bkz. CLAUDE.md "Bilinen ortam kısıtı"); CI'de zararsızdır.
      PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @hukukai/api prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
