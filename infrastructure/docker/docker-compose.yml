services:
  postgres:
    image: postgres:16-alpine
    container_name: hukukai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hukukai
      POSTGRES_PASSWORD: hukukai_dev_password
      POSTGRES_DB: hukukai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hukukai -d hukukai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hukukai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: hukukai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hukukai
      MINIO_ROOT_PASSWORD: hukukai_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: hukukai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 hukukai hukukai_dev_password &&
      mc mb -p local/hukukai-documents || true &&
      mc mb -p local/hukukai-reports || true &&
      exit 0
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
